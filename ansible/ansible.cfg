# Ansible configuration for the PlayPulse production deployment.
# Run all ansible-playbook commands from inside this ansible/ directory so
# these settings and the relative paths below are picked up automatically.

[defaults]
inventory = inventory.ini
roles_path = roles
# Fresh production servers are not yet in known_hosts; skip the interactive
# prompt on first connect. Remove this if you pre-seed known_hosts.
host_key_checking = False
retry_files_enabled = False
# Silence the "discovered interpreter" warning on Ubuntu targets.
interpreter_python = auto_silent

[diff]
# Always show file diffs (e.g. when templates/env.j2 changes the rendered
# .env). This satisfies the "show .env changes as a diff" requirement without
# having to pass --diff on every run. It is still only informational.
always = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
