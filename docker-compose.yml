version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: project_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: project_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - project_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: project_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - project_network

  # One-shot topic creation. Auto-create is left on for convenience, but it
  # produces single-partition topics, which caps every consumer group at one
  # active member forever -- a topic's partition count cannot be reduced, so
  # discovering this under load means a rebuild. Creating them up front is the
  # only cheap moment to get it right.
  #
  # Idempotent (--if-not-exists), so it is safe on every `up`. It will not
  # widen a topic that already exists; see scripts/create_topics.sh --alter.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: project_kafka_init
    depends_on:
      - kafka
    restart: "no"
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for the broker..."
        until kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1; do
          sleep 2
        done
        for topic in app-stats reviews network-metrics; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" \
            --partitions "$${KAFKA_TOPIC_PARTITIONS}" \
            --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - project_network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: project_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: playpulse
      # Same docker network as the broker — use the internal listener.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - project_network

  crawler:
    build: ./crawler
    container_name: project_crawler
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - zookeeper
    environment:
      # Docker-network addresses — intentionally NOT from crawler/.env
      # (that file is for host/venv: localhost:9092). See docs/setup.md.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # TODO: replace once App API (Django) is added as a compose service.
      # Until then, App API is assumed to run on the host at :8000.
      APP_API_BASE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - project_network

  storage-consumer:
    build: ./storage_consumer
    container_name: project_storage_consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      # Docker-network addresses — intentionally NOT from storage_consumer/.env
      # (that file is for host/venv: localhost:9092 and 127.0.0.1). See
      # docs/setup.md.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # One container, three threads. To deploy as three containers with
      # independent restart policies instead, duplicate this service and set
      # STORAGE_PIPELINES on each — no code change, and each keeps its own
      # consumer group and offsets.
      STORAGE_PIPELINES: ${STORAGE_PIPELINES:-all}
    healthcheck:
      # Per-pipeline liveness, not just "is the process up". See healthcheck.sh.
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      # Generous: the first poll can wait out a consumer-group join, and a
      # cold start also runs migrations.
      start_period: 90s
      retries: 3
    # SIGTERM is handled: workers finish their in-flight batch, commit, and
    # leave the consumer group. Well above the batch time plus the database
    # retry window, so a stop does not cut a write short and force a replay.
    stop_grace_period: 45s
    networks:
      - project_network

  network-analyzer:
    # Context is the repo root so the image can include both the package and
    # scripts/analyze_pcaps.sh. The entrypoint dispatches --batch (default) vs
    # single-file `python -m network_analyzer.main` arguments.
    build:
      context: .
      dockerfile: network_analyzer/Dockerfile
    container_name: project_network_analyzer
    # Behind a profile so `docker compose up` never starts it: this subsystem is
    # an on-demand batch job over manually recorded captures, not a daemon.
    #
    #   docker compose run --rm network-analyzer
    #   docker compose run --rm network-analyzer --batch --dry-run --keep
    #   docker compose run --rm network-analyzer \
    #     --file /data/pcap/inbox/com.whatsapp__upload__20260907T141500.pcap
    profiles:
      - tools
    depends_on:
      - kafka
    environment:
      # Docker-network addresses — intentionally NOT from network_analyzer/.env
      # (that file is for host/venv: localhost:9092). See docs/setup.md.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # TODO: replace once App API (Django) is added as a compose service.
      # Until then, App API is assumed to run on the host at :8000.
      APP_API_BASE_URL: http://host.docker.internal:8000
      ANALYZER_PCAP_ROOT: /data/pcap
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Captures are recorded on a phone and copied in by hand, so the inbox is
      # a bind mount rather than a named volume: the operator needs to drop
      # files into it from the host.
      - ./data/pcap:/data/pcap
    networks:
      - project_network

networks:
  project_network:
    driver: bridge

volumes:
  postgres_data:
